name: Previsione e verifica

on:
  schedule:                    # orari UTC (ora solare: +1 h, ora legale: +2 h). I giri di riserva si fermano subito se la previsione c'e' gia'
    - cron: "17 15 * * *"      # 16:17 ora solare, dopo il bollettino CPSM delle 13:30
    - cron: "47 16 * * *"      # 17:47 ora solare, riserva
    - cron: "13 18 * * *"      # 19:13 ora solare, riserva
  workflow_dispatch:
    inputs:
      data:
        description: "Giorno della previsione AAAA-MM-GG (vuoto = domani)"
        required: false
      da:
        description: "Ora inizio (vuoto = tre fasce 05-12, 12-18, 18-24)"
        required: false
      a:
        description: "Ora fine (vuoto = tre fasce 05-12, 12-18, 18-24)"
        required: false
      forza:
        description: "Rifai anche se la previsione di domani c'e' gia' (si/no)"
        required: false
        default: "si"
      giro:
        description: "mattino (08:25) e meteo (05:30, 11:15, 18:30) = aggiornamento del vento; marea = nuovo bollettino, solo marea e correnti; vuoto = giro principale. Li manda il Worker Cloudflare"
        required: false
        default: ""
      riprova:
        description: "si = rilancio automatico dopo un errore (lo mette il giro stesso: un solo tentativo)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: previsione
  cancel-in-progress: false

env:
  TZ: Europe/Rome
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      salta: ${{ steps.guard.outputs.salta }}
      problemi: ${{ steps.problemi.outputs.elenco }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main      # 26/11/2026: sempre gli ultimi dati, anche se il giro e' stato in coda dietro un altro

      - name: Controllo doppioni (previsione di domani gia' fatta oggi?)
        id: guard
        env:
          FORZA: ${{ github.event.inputs.forza }}
          DATA_IN: ${{ github.event.inputs.data }}
          GIRO: ${{ github.event.inputs.giro }}
        run: |
          python3 - <<'EOF'
          import os, glob, json, datetime as dt
          from zoneinfo import ZoneInfo
          # 20/11/2026: GitHub puo' far partire i giri programmati con ore di ritardo (19/11: 19:13 partito alle 01:37).
          # Il giro principale automatico si ferma prima delle 14:00 italiane, e conta come "gia' fatta" solo una previsione
          # generata oggi dalle 16:00 in poi (cosi' un giro a mano del primo pomeriggio non fa saltare quello delle 16:25).
          # 25/11/2026: i giri del Worker (mattino, meteo, marea) si fanno sempre: un giro a mano non li fa saltare.
          ORA_MIN, ORA_FATTA = 14, 16
          adesso = dt.datetime.now(ZoneInfo("Europe/Rome"))
          oggi = adesso.date(); domani = oggi + dt.timedelta(days=1)
          forza = (os.environ.get("FORZA") or "").strip().lower() in ("si", "sì", "yes", "true")
          giro = (os.environ.get("GIRO") or "").strip().lower()
          fatte = set()
          for f in glob.glob(f"Previsioni/previsione_{domani.strftime('%d-%m-%Y')}_0500-1200*_v*.json"):
              try:
                  P = json.load(open(f, encoding="utf-8"))
                  g = dt.datetime.strptime(P.get("generato") or "", "%d/%m/%Y %H:%M")
              except ValueError:
                  continue
              if g.date() == oggi and g.hour >= ORA_FATTA:
                  fatte.add(P.get("area") or "centro")
          manuale = forza or os.environ.get("DATA_IN")
          tutte = {"centro", "nord", "sud"}
          if manuale:
              salta, motivo = False, "giro a mano"
          elif giro in ("mattino", "meteo", "marea"):
              salta, motivo = False, ""
          elif adesso.hour < ORA_MIN:
              salta, motivo = True, "prima delle 14:00 (giro programmato in ritardo)"
          else:
              salta, motivo = tutte <= fatte, "previsione di domani gia' fatta oggi dalle 16:00 (nessun doppione)"
          print("Previsione di domani fatta oggi dalle 16:00 per: " + (", ".join(sorted(fatte)) or "nessuna zona"))
          print(("Giro saltato: " + motivo + ".") if salta else f"Giro da fare ({giro or 'principale'}).")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"salta={'true' if salta else 'false'}\n")
          EOF

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.salta != 'true'
        with:
          python-version: "3.12"

      - name: Controllo dei file dati
        if: steps.guard.outputs.salta != 'true'
        run: |
          ANNO=$(date +%Y)
          for f in "marea_astronomica_${ANNO}.json" correnti_laguna.json verifica_archivio.json; do
            [ -f "$f" ] || { echo "::error::Manca $f nel repository: caricalo (vedi README)"; exit 1; }
          done

      - name: Memoria dei dati Open-Meteo e delle correzioni (per ricalcolare la marea senza nuove richieste)
        if: steps.guard.outputs.salta != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/om_cache
          key: om-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: om-

      - name: Previsione (con la verifica dei giorni conclusi)
        id: prev
        if: steps.guard.outputs.salta != 'true'
        continue-on-error: true      # se un servizio esterno non risponde, il sito si pubblica lo stesso con i dati gia' presenti
        env:
          DATA_IN: ${{ github.event.inputs.data }}
          DA_IN: ${{ github.event.inputs.da }}
          A_IN: ${{ github.event.inputs.a }}
          GIRO: ${{ github.event.inputs.giro }}
        run: |
          DATA="${DATA_IN:-$(date -d tomorrow +%F)}"
          OGGI=$(date +%F); ORA=$((10#$(date +%H))); MIN=$((10#$(date +%H) * 60 + 10#$(date +%M)))
          export FL_CACHE="$RUNNER_TEMP/om_cache"      # v1.50: una sola richiesta a Open-Meteo per giorno e zona, per tutte le fasce
          mkdir -p "$FL_CACHE"; find "$FL_CACHE" -mindepth 1 -maxdepth 1 -mtime +3 -exec rm -rf {} +
          export FL_INIZIO=$(date +%s)                 # i dati in memoria di giri precedenti valgono solo per il ricalcolo della marea
          export FL_PROBLEMI="$RUNNER_TEMP/problemi.txt"   # 27/11/2026: guasti da segnalare dopo la pubblicazione
          ERR=0; PRIMA=1
          prev() {   # giorno, da, a, area
            local opz="--non-aprire --no-pdf"
            if [ "$GIRO" = "marea" ]; then opz="$opz --solo-marea"
            elif [ $PRIMA -ne 1 ]; then opz="$opz --no-verifica --no-archivi"; fi   # verifica e archivi una volta sola, nel primo giro (centro)
            PRIMA=0
            python3 fd_previsione.py "$1" "$2" "$3" $opz --area "$4" || {
              C=$?
              if [ "$GIRO" = "marea" ] && [ $C -eq 4 ]; then echo "::notice::Solo marea $4 $1 $2-$3: dati meteo non in memoria, la previsione resta."
              else echo "::warning::Previsione $4 $1 $2-$3 non riuscita"; echo "Previsione non riuscita: $4 $1 $2-$3" >> "$FL_PROBLEMI"; ERR=1; fi
            }
          }
          TUTTE="05:00-12:00 12:00-18:00 18:00-24:00"      # 25/11/2026: tre fasce senza ore scoperte tra le 05 e le 24
          if [ -n "$DA_IN" ] || [ -n "$A_IN" ]; then
            FASCE="${DA_IN:-05:00}-${A_IN:-12:00}"            # giro a mano con una finestra scelta
          else
            FASCE="$TUTTE"
          fi
          # fasce di oggi non ancora finite (almeno 30 minuti alla fine): si aggiorna anche quella in corso
          OGG=""
          if [ -z "$DATA_IN$DA_IN$A_IN" ]; then
            for F in $TUTTE; do FINE="${F#*-}"; [ $((10#${FINE%:*} * 60 - MIN)) -ge 30 ] && OGG="$OGG $F"; done
          fi
          # domani: nel giro principale, in quelli a mano e nei giri del Worker dalle 08:00
          DOMANI_SI=1
          if [ "$GIRO" = "meteo" ] && [ $ORA -lt 8 ]; then DOMANI_SI=0; fi
          GIORNI=""
          if [ $DOMANI_SI -eq 1 ]; then
            if [ "$GIRO" != "marea" ] || ls Previsioni/previsione_$(date -d "$DATA" +%d-%m-%Y)_*.json >/dev/null 2>&1; then
              for F in $FASCE; do for Z in centro nord sud; do prev "$DATA" "${F%-*}" "${F#*-}" "$Z"; done; done
              GIORNI="$DATA"
            fi
          fi
          for F in $OGG; do for Z in centro nord sud; do prev "$OGGI" "${F%-*}" "${F#*-}" "$Z"; done; done
          [ -n "$OGG" ] && GIORNI="$GIORNI $OGGI"
          for G in $GIORNI; do for Z in centro nord sud; do python3 fd_previsione.py "$G" --sintesi --area "$Z" || { echo "Sintesi non riuscita: $Z $G" >> "$FL_PROBLEMI"; ERR=1; }; done; done
          exit $ERR

      - name: Tendenza dei prossimi giorni
        id: tend
        if: steps.guard.outputs.salta != 'true' && github.event.inputs.giro != 'marea' && github.event.inputs.giro != 'meteo'
        continue-on-error: true      # v1.0: se non riesce resta la tendenza precedente, il resto non cambia
        env:
          DATA_IN: ${{ github.event.inputs.data }}
          DA_IN: ${{ github.event.inputs.da }}
          A_IN: ${{ github.event.inputs.a }}
        run: |
          DATA="${DATA_IN:-$(date -d tomorrow +%F)}"
          export FL_PROBLEMI="$RUNNER_TEMP/problemi.txt"
          python3 fd_tendenza.py "$DATA" "${DA_IN:-05:00}" "${A_IN:-12:00}"

      - name: Guasti del giro
        id: problemi
        if: always() && steps.guard.outputs.salta != 'true'
        env:
          PREV: ${{ steps.prev.outcome }}
          TEND: ${{ steps.tend.outcome }}
        run: |
          F="$RUNNER_TEMP/problemi.txt"; touch "$F"
          if [ "$PREV" = "failure" ] && [ ! -s "$F" ]; then echo "Passo Previsione non riuscito" >> "$F"; fi
          if [ "$TEND" = "failure" ]; then echo "Prossimi giorni: passo non riuscito" >> "$F"; fi
          echo "elenco=$(sort -u "$F" | paste -sd '|' -)" >> "$GITHUB_OUTPUT"

      - name: Prova dei collegamenti delle verifiche
        if: steps.guard.outputs.salta != 'true'
        run: python3 strumenti/prova_verifiche.py      # se fallisce, il sito in linea resta quello di prima

      - name: Pagine per GitHub Pages
        if: steps.guard.outputs.salta != 'true'
        run: python3 build_site.py

      - name: Salvataggio di archivio e previsioni nel repository
        if: steps.guard.outputs.salta != 'true'
        env:
          GIRO: ${{ github.event.inputs.giro }}
        run: |
          git config user.name "forecast-lagoon-bot"
          git config user.email "forecast-lagoon-bot@users.noreply.github.com"
          git add verifica_archivio.json acqua_archivio.json onde_archivio.json nebbia_archivio.json tendenza.json tendenza_archivio.json tendenza_correzioni.json 2>/dev/null || true
          git add marea_cpsm.json 2>/dev/null || true
          git add -A Previsioni     # v1.50: anche le sintesi vecchie cancellate (una sola sintesi per giorno e zona)
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Previsione e verifica $(date +%F)${GIRO:+ ($GIRO)}"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.salta != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.salta != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.salta != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  riprova:                     # 26/11/2026: se calcolo, salvataggio o pubblicazione falliscono, UN solo nuovo giro con le stesse scelte
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') && github.event.inputs.riprova != 'si'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rilancio
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_IN: ${{ github.event.inputs.data }}
          DA_IN: ${{ github.event.inputs.da }}
          A_IN: ${{ github.event.inputs.a }}
          FORZA: ${{ github.event.inputs.forza }}
          GIRO: ${{ github.event.inputs.giro }}
        run: |
          # un giro gia' in coda pubblichera' lui: rilanciare lo farebbe annullare
          CODA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow previsione.yml --limit 20 --json status --jq '[.[]|select(.status=="queued" or .status=="pending" or .status=="waiting")]|length')
          if [ "$CODA" != "0" ]; then echo "::notice::C'e' gia' un giro in attesa: nessun rilancio."; exit 0; fi
          gh workflow run previsione.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f data="$DATA_IN" -f da="$DA_IN" -f a="$A_IN" -f forza="${FORZA:-no}" -f giro="$GIRO" -f riprova=si
          echo "::notice::Giro rilanciato una volta."

  sentinella:                  # dopo la pubblicazione: se una verifica manca il giro risulta fallito, il sito resta aggiornato
    needs: [build, deploy]
    if: needs.build.outputs.salta != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifiche calcolate e visibili
        env:
          GIRO: ${{ github.event.inputs.giro }}
        run: |
          python3 build_site.py > /dev/null
          python3 controlla_verifiche.py

      - name: Previsioni e fonti complete
        if: always() && needs.build.outputs.problemi != ''
        env:
          ELENCO: ${{ needs.build.outputs.problemi }}
        run: |
          echo "$ELENCO" | tr '|' '\n' | sed 's/^/::error::/'
          exit 1

      - name: Dati in diretta e allerte
        if: always()
        run: python3 controlla_dirette.py
