name: Previsione e verifica

on:
  schedule:                    # orari UTC (ora solare: +1 h, ora legale: +2 h). I giri di riserva si fermano subito se la previsione c'e' gia'
    - cron: "17 15 * * *"      # 16:17 ora solare, dopo il bollettino CPSM delle 13:30
    - cron: "47 16 * * *"      # 17:47 ora solare, riserva
    - cron: "13 18 * * *"      # 19:13 ora solare, riserva
  workflow_dispatch:
    inputs:
      data:
        description: "Giorno della previsione AAAA-MM-GG (vuoto = domani)"
        required: false
      da:
        description: "Ora inizio (vuoto = 05:00)"
        required: false
      a:
        description: "Ora fine (vuoto = 12:00)"
        required: false
      forza:
        description: "Rifai anche se la previsione di domani c'e' gia' (si/no)"
        required: false
        default: "si"
      giro:
        description: "mattino = previsione provvisoria del mattino (la manda il Worker Cloudflare alle 08:25); vuoto = giro normale"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: previsione
  cancel-in-progress: false

env:
  TZ: Europe/Rome
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      salta: ${{ steps.guard.outputs.salta }}
    steps:
      - uses: actions/checkout@v4

      - name: Controllo doppioni (previsione di domani gia' fatta oggi?)
        id: guard
        env:
          FORZA: ${{ github.event.inputs.forza }}
          DATA_IN: ${{ github.event.inputs.data }}
          GIRO: ${{ github.event.inputs.giro }}
        run: |
          python3 - <<'EOF'
          import os, glob, json, datetime as dt
          from zoneinfo import ZoneInfo
          # 20/11/2026: GitHub puo' far partire i giri programmati con ore di ritardo (19/11: 19:13 partito alle 01:37).
          # Prima delle 14:00 italiane (bollettino CPSM 13:30) un giro automatico si ferma, e conta come "gia' fatta"
          # solo una previsione generata oggi dalle 14:00 in poi.
          # Eccezione: il giro del mattino (giro=mattino, dal Worker Cloudflare alle 08:25) fa la previsione PROVVISORIA
          # di domani se oggi non e' ancora stata fatta per tutte le zone (a qualsiasi ora).
          ORA_MIN = 14
          adesso = dt.datetime.now(ZoneInfo("Europe/Rome"))
          oggi = adesso.date(); domani = oggi + dt.timedelta(days=1)
          forza = (os.environ.get("FORZA") or "").strip().lower() in ("si", "sì", "yes", "true")
          mattino = (os.environ.get("GIRO") or "").strip().lower() == "mattino"
          fatte, fatte_oggi = set(), set()
          for f in glob.glob(f"Previsioni/previsione_{domani.strftime('%d-%m-%Y')}_0500-1200*_v*.json"):
              try:
                  P = json.load(open(f, encoding="utf-8"))
                  g = dt.datetime.strptime(P.get("generato") or "", "%d/%m/%Y %H:%M")
              except ValueError:
                  continue
              if g.date() == oggi:
                  fatte_oggi.add(P.get("area") or "centro")
                  if g.hour >= ORA_MIN:
                      fatte.add(P.get("area") or "centro")
          presto = adesso.hour < ORA_MIN
          manuale = forza or os.environ.get("DATA_IN")
          tutte = {"centro", "nord", "sud"}
          if manuale:
              salta, motivo = False, "giro a mano"
          elif mattino:
              salta, motivo = tutte <= fatte_oggi, "giro del mattino: previsione di domani gia' fatta oggi"
          elif presto:
              salta, motivo = True, "prima delle 14:00 (giro programmato in ritardo)"
          else:
              salta, motivo = tutte <= fatte, "previsione di domani gia' fatta oggi dalle 14:00 (nessun doppione)"
          print("Previsione di domani fatta oggi per: " + (", ".join(sorted(fatte_oggi)) or "nessuna zona")
                + " · dalle 14:00: " + (", ".join(sorted(fatte)) or "nessuna zona"))
          print(("Giro saltato: " + motivo + ".") if salta else ("Giro da fare" + (" (mattino, previsione provvisoria)." if mattino else ".")))
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"salta={'true' if salta else 'false'}\n")
          EOF

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.salta != 'true'
        with:
          python-version: "3.12"

      - name: Controllo dei file dati
        if: steps.guard.outputs.salta != 'true'
        run: |
          ANNO=$(date +%Y)
          for f in "marea_astronomica_${ANNO}.json" correnti_laguna.json verifica_archivio.json; do
            [ -f "$f" ] || { echo "::error::Manca $f nel repository: caricalo (vedi README)"; exit 1; }
          done

      - name: Previsione (con la verifica dei giorni conclusi)
        if: steps.guard.outputs.salta != 'true'
        continue-on-error: true      # se un servizio esterno non risponde, il sito si pubblica lo stesso con i dati gia' presenti
        env:
          DATA_IN: ${{ github.event.inputs.data }}
          DA_IN: ${{ github.event.inputs.da }}
          A_IN: ${{ github.event.inputs.a }}
        run: |
          DATA="${DATA_IN:-$(date -d tomorrow +%F)}"
          ERR=0
          python3 fd_previsione.py "$DATA" "${DA_IN:-05:00}" "${A_IN:-12:00}" --non-aprire || { echo "::warning::Previsione Laguna Centro non riuscita"; ERR=1; }
          # Laguna Nord e Sud: la verifica dei giorni conclusi e' gia' stata fatta sopra
          python3 fd_previsione.py "$DATA" "${DA_IN:-05:00}" "${A_IN:-12:00}" --non-aprire --no-verifica --area nord || { echo "::warning::Previsione Laguna Nord non riuscita"; ERR=1; }
          python3 fd_previsione.py "$DATA" "${DA_IN:-05:00}" "${A_IN:-12:00}" --non-aprire --no-verifica --area sud || { echo "::warning::Previsione Laguna Sud non riuscita"; ERR=1; }
          exit $ERR

      - name: Pagine per GitHub Pages
        if: steps.guard.outputs.salta != 'true'
        run: python3 build_site.py

      - name: Salvataggio di archivio e previsioni nel repository
        if: steps.guard.outputs.salta != 'true'
        run: |
          git config user.name "forecast-lagoon-bot"
          git config user.email "forecast-lagoon-bot@users.noreply.github.com"
          git add verifica_archivio.json acqua_archivio.json onde_archivio.json nebbia_archivio.json Previsioni/*.json Previsioni/*.html Previsioni/*.pdf 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Previsione e verifica $(date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.salta != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.salta != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.salta != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
