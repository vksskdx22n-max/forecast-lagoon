<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forecast Lagoon">
<meta name="theme-color" content="#06131d">
<meta name="versione-sito" content="__VERSIONE_SITO__">
<link rel="apple-touch-icon" href="assets/icona_180.png">
<link rel="manifest" href="manifest.json">
<title>Forecast Lagoon</title>
<style>
:root{--ink:#06131d;--card:#0f2638;--card2:#14314a;--line:#23465f;--txt:#eaf3f7;--mut:#8aa6b6;--soft:#cfe0e8;--teal:#5fd4d0;
--verde:#38c98a;--giallo:#f2b63c;--rosso:#ef5b4c;--nd:#5b7488;--on-verde:#03301d;--on-giallo:#3d2900;--on-rosso:#3d0a05;--verde-s:#1f9e68;--giallo-s:#d9961a;--rosso-s:#d23a2c;--on-verde-s:#ffffff;--on-giallo-s:#2a1c00;--on-rosso-s:#ffffff;--on-nd:#e6eef3}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;position:relative}
.testa{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(env(safe-area-inset-top) + 18px) 20px 12px}
.testa h1{font-size:34px;line-height:1.05;margin-top:6px}
.testa .sub{max-width:none;margin-top:6px;font-size:14px}
.hero{position:relative;height:max(260px,calc(100vh - 475px));height:max(260px,calc(100svh - 475px));overflow:hidden;background:#0b1b28}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,22,.9) 0%,rgba(4,14,22,.35) 30%,rgba(4,14,22,0) 52%,rgba(6,19,29,.96) 100%);pointer-events:none}
.top{position:absolute;left:24px;right:24px;top:calc(env(safe-area-inset-top) + 28px)}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--teal);text-transform:uppercase}
h1{font-size:42px;line-height:1;font-weight:750;letter-spacing:-.02em;margin-top:8px}
h1 span{color:var(--teal)}
.sub{color:#b8cdd8;font-size:15px;line-height:1.45;margin-top:10px;max-width:270px}
.oggi{position:absolute;left:24px;bottom:12px;font-size:13.5px;color:var(--soft);display:flex;align-items:center;gap:8px}
.oggi b{font-weight:650}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(95,212,208,.18)}
.credit{position:absolute;right:12px;bottom:8px;font-size:9px;color:rgba(255,255,255,.5)}
.zones{padding:6px 16px 0}
.zone{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:12px 16px 12px 0;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:transform .15s}
.zone:active{transform:scale(.985)}
.zone .bar{align-self:stretch;min-height:52px;border-radius:0 6px 6px 0}
.zname{font-size:20px;font-weight:650;letter-spacing:-.01em;line-height:1.05}
.zmeta{font-size:12.5px;line-height:1.15;color:var(--mut);margin-top:1px;white-space:nowrap}
.adA{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12.5px;line-height:1.2;color:#cfe3ec;font-weight:600;white-space:nowrap}.adA:empty{display:none}
.adA i{width:9px;height:9px;border-radius:50%;flex:none}.adA small{color:var(--mut);font-weight:500;font-size:12px}
.vad{padding:14px 16px}.vad .t{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.vad .n{display:flex;align-items:baseline;gap:10px;margin-top:4px;font-size:30px;font-weight:700}.vad .n small{font-size:14px;color:var(--mut);font-weight:500}.vad .n .d{font-size:18px}
.vad .r{font-size:13px;color:#b8cbd6;margin-top:2px}.vad .ln{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--mut)}.vad .ln svg{flex:1;height:34px}
.badge{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.chip{font-size:12px;font-weight:650;padding:5px 11px;border-radius:999px;white-space:nowrap}
.wind{font-size:12px;color:var(--soft)}
.zone.off{opacity:.6;cursor:default}
.foot{padding:14px 24px calc(env(safe-area-inset-bottom) + 30px);color:#6f8a9a;font-size:11px;line-height:1.6}
.foot b{color:#9db5c3;font-weight:600}
.zhero{position:relative;height:300px;overflow:hidden;background:#0b1b28}
.zhero svg{position:absolute;inset:0;width:100%;height:100%}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;font-size:14px;color:var(--soft);background:rgba(6,19,29,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.ztitle{position:absolute;left:22px;bottom:18px}
.ztitle h2{font-size:32px;font-weight:750;letter-spacing:-.02em}
.days{display:flex;gap:8px;padding:16px 16px 4px;overflow-x:auto}
.day{flex:1;min-width:68px;text-align:center;padding:9px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--mut);cursor:pointer;position:relative}
.day b{display:block;font-size:15px;color:var(--txt);margin-top:2px}
.day i{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%}
.day.on{background:var(--txt);color:#33505f;border-color:var(--txt)}.day.on b{color:var(--ink)}
.sec{padding:12px 16px 0}
.verdict{border-radius:24px;padding:18px}
.verdict .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.verdict .v{font-size:30px;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.verdict p{font-size:14px;line-height:1.4;margin-top:4px;opacity:.9}
.verdict .prov{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.9);color:#0b1a24;font-size:12.5px;font-weight:650}
.hours{display:grid;gap:4px;margin-top:14px}
.hours div{border-radius:8px;text-align:center;padding:4px 0;font-size:10.5px;font-weight:650;background:var(--cs,#22394B);border:2px solid #fff;color:var(--cn,#eaf3f7)}
.hours div b{display:block;font-size:15px;color:inherit}
.hours div u{display:block;text-decoration:none;font-size:9.5px;font-weight:600;color:inherit}
.tab th u{display:block;text-decoration:none;text-transform:none;letter-spacing:0;font-size:10px;margin-top:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.ch span{text-transform:none;letter-spacing:0;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.big small{font-size:14px;color:var(--mut);font-weight:500;margin-left:4px}
.note{color:var(--mut);font-size:12.5px;margin-top:5px;line-height:1.4}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;padding:14px 16px 0}
.btn{text-align:center;padding:14px 0;border-radius:16px;font-size:14.5px;font-weight:650;background:var(--card2);border:1px solid var(--line)}
.btn.p{background:var(--teal);color:#04282a;border-color:var(--teal)}
.list{padding:18px 16px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .l{display:flex;gap:9px;align-items:center}.row .l i{width:9px;height:9px;border-radius:50%}
.row .r a{color:var(--teal);font-size:13px;margin-left:12px}
.empty{padding:26px 22px;color:var(--soft);line-height:1.5}
.ttl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 2px 6px}
.info{position:relative;flex:none;margin-top:2px;width:38px;height:38px;border-radius:50%;background:rgba(6,19,29,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);color:var(--txt);font:italic 700 19px Georgia,serif;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.velo{position:fixed;inset:0;background:rgba(2,8,12,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0c2131;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);-webkit-overflow-scrolling:touch}
.sheet h3{font-size:22px;font-weight:750;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.sheet h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:18px 0 6px}
.sheet p,.sheet li{font-size:14.5px;line-height:1.5;color:var(--soft)}.sheet ul{padding-left:18px}
.sheet .x{font-size:15px;font-weight:600;color:var(--mut);cursor:pointer;padding:4px 8px}
.sem{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.ver{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:rgba(95,212,208,.16);color:var(--teal);font-size:10.5px;letter-spacing:.06em;vertical-align:1px;text-transform:none}
.avv{color:#8fa9b8;font-size:12px;line-height:1.4;margin-top:6px}   /* v3.10, testo v3.11 */
.foot a{color:inherit}.sheet p a{color:var(--teal);text-decoration:underline}.avvall{border:1px solid #c9a227;background:#2a2410;color:#f3e3a4;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.4;margin:8px 0}.allui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px}.allui:empty{display:none}.allui button{background:var(--teal);color:#06131d;border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;font-family:inherit}.allui button.sec{background:transparent;color:var(--teal);border:1px solid var(--teal)}.allui .st{width:100%;font-size:13.5px;color:#cfe3ec}
.agg{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:30;max-width:536px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--teal);color:#04282a;border-radius:18px;padding:13px 14px 13px 18px;font-size:14.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.agg b{background:#04282a;color:var(--teal);border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.tab{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.tab th{font-weight:500;color:var(--mut);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:0 0 6px}
.tab td{text-align:center;padding:7px 0;border-top:1px solid rgba(35,70,95,.6);color:var(--soft)}
.tab td:first-child{color:var(--mut);font-weight:600}.tab .kn{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--txt)}
.tab .kn i{width:8px;height:8px;border-radius:50%}
.arr{display:inline-block;font-size:13px;line-height:1}
.mini{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.01em}.mini small{font-size:12.5px;color:var(--mut);font-weight:500;margin-left:3px}
details.card summary{cursor:pointer;list-style:none;font-size:11.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
details.card p{font-size:13.5px;line-height:1.5;color:var(--soft);margin-top:8px}
@media (min-width:900px){
 .wrap{max-width:1400px}
 .home{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);grid-template-areas:"hero testa" "hero zones" "hero foot";grid-template-rows:auto auto 1fr;column-gap:8px}
 .home .hero{grid-area:hero;position:sticky;top:0;height:100vh}
 .home .testa{grid-area:testa;padding:40px 28px 18px}.home .testa h1{font-size:46px}
 .home .zones{grid-area:zones;padding:6px 24px 0}.home .foot{grid-area:foot}
 .zone{padding:18px 18px 18px 0}
 .zhero{height:380px}
 .zhero svg{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%)}
 .corpo{column-count:2;column-gap:4px;padding:0 12px}
 .corpo .sec{break-inside:avoid}
 .corpo .days,.corpo .btns,.corpo .list{column-span:all}
 .zwrap{max-width:1200px;margin:0 auto}
}
.ritardo{margin:0 16px 10px;padding:11px 14px;border-radius:14px;background:rgba(242,182,60,.14);border:1px solid rgba(242,182,60,.45);color:#f6d48a;font-size:13.5px;line-height:1.4}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:18;opacity:0}}
.pulse{animation:pulse 2.4s ease-out infinite}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Caricamento…</div></div>
<script>
const app=document.getElementById('app');
const VERSIONE='__VERSIONE_SITO__',CODICE='__CODICE_SITO__';
const TXT={verde:'Verde',giallo:'Giallo',rosso:'Rosso'};
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
let D=null,G=null;
const col=c=>TXT[c]?`var(--${c})`:'var(--nd)', oncol=c=>TXT[c]?`var(--on-${c})`:'var(--on-nd)';
const nf=(x,d=1)=>x==null?'–':Number(x).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const fresco=u=>u+(u.includes('?')?'&':'?')+'v='+encodeURIComponent((D&&D.aggiornato_utc)||CODICE);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function dataDi(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}
function relativo(iso){const t=new Date();t.setHours(0,0,0,0);const n=Math.round((dataDi(iso)-t)/864e5);return n===0?'Oggi':n===1?'Domani':n===-1?'Ieri':null}
function etichetta(iso){const d=dataDi(iso),r=relativo(iso);return (r?r+' · ':'')+GIORNI[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)}
function ultima(z){return z.voci&&z.voci[0]}
function mappa(vb,o){
 let s=`<svg viewBox="${vb}" preserveAspectRatio="${o.meet?'xMidYMid meet':'xMidYMid slice'}" xmlns="http://www.w3.org/2000/svg"><defs>
 <filter id="gl${o.k}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${o.blur||5}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="gr${o.k}"><feColorMatrix type="matrix" values="0.78 0 0 0 0  0 0.86 0 0 0.01  0 0 0.95 0 0.03  0 0 0 1 0"/></filter></defs>
 <image href="assets/laguna_sat.jpg" x="${G.img?G.img.x:0}" y="${G.img?G.img.y:0}" width="${G.img?G.img.w:G.w}" height="${G.img?G.img.h:G.h}" filter="url(#gr${o.k})" opacity=".9"/>`;
 D.zone.forEach(z=>{const v=ultima(z),c=v?v.colore:null,on=!o.only||o.only===z.id,hex=getComputedStyle(document.documentElement).getPropertyValue('--'+(TXT[c]?c:'nd')).trim();
  s+=`<path d="${G.bacini[z.id]}" fill="${hex}" fill-opacity="${on?(o.fo||.4):.06}" stroke="${hex}" stroke-opacity="${on?.95:.25}" stroke-width="${o.sw||2}" ${on?`filter="url(#gl${o.k})"`:''} ${o.click?`style="cursor:pointer" onclick="location.hash='zona/${z.id}'"`:''}/>`;});
 Object.values(G.bocche).forEach(([n,x,y])=>{s+=`<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#5fd4d0" stroke-width="2.5" class="pulse"/><circle cx="${x}" cy="${y}" r="6" fill="#eaf3f7" stroke="#06131d" stroke-width="2"/>
  <text x="${x+14}" y="${y+7}" fill="#fff" font-size="${o.fs||22}" font-weight="700" paint-order="stroke" stroke="#06131d" stroke-width="4" stroke-opacity=".6">${n}</text>`});
 if(o.labels)D.zone.forEach(z=>{const b=G.bbox[z.id],v=ultima(z),c=v?v.colore:null,hex=getComputedStyle(document.documentElement).getPropertyValue('--'+(TXT[c]?c:'nd')).trim();
  const t=z.nome.replace('Laguna ',''),w=t.length*21+62,x=z.id==='nord'?b[0]+(b[2]-b[0])*.52:b[0]+(b[2]-b[0])*.18,y=z.id==='nord'?b[1]+(b[3]-b[1])*.55:(b[1]+b[3])/2;
  s+=`<g style="pointer-events:none"><rect x="${x}" y="${y-30}" width="${w}" height="52" rx="26" fill="#06131d" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".18"/>
  <circle cx="${x+27}" cy="${y-4}" r="10" fill="${hex}"/><text x="${x+47}" y="${y+8}" fill="#fff" font-size="32" font-weight="750" letter-spacing="-.5">${t}</text></g>`});
 return s+'</svg>'}
function piede(){return `<div class="foot"><b>Fonti</b> · dati meteo e mare aperto <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0; modelli ICON-D2, ICON-2i, ECMWF; dati elaborati e corretti con misure locali) · marea CPSM Comune di Venezia · correnti modello Laguna Viva · immagine: ${esc(G.fonte_immagine)} · costa ${esc(G.fonte_costa)}; ${esc(G.nota_confini)}.<br>Previsione indicativa: non sostituisce i bollettini ufficiali.<br>Sito v${esc(D.versione_sito)}${D.autore?' · a cura di '+esc(D.autore):''} · aggiornato ${new Date(D.aggiornato_utc).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`}
function finestra(){const v=D.zone.map(ultima).filter(Boolean)[0];return v&&v.finestra}
function istruzioni(){
 const R=D.regole||{},v=R.verde_fino_a,r=R.rosso_da,k=x=>x==null?'…':nf(x,0),k1=x=>x==null?'…':nf(x+1,0),km=x=>x==null?'…':nf(x-1,0);
 const el=document.createElement('div');el.className='velo';el.onclick=e=>{if(e.target===el)el.remove()};
 el.innerHTML=`<div class="sheet"><h3>Come si legge<span class="x" onclick="this.closest('.velo').remove()">Chiudi</span></h3>
 <h4>Cos'è</h4><p>Previsione meteo-marina della laguna per uscire in barca: vento, marea, correnti, onda e pioggia, nella finestra ${esc(finestra()||'del mattino')}. Si aggiorna da sola due volte al giorno con la previsione del giorno dopo (vedi “Due previsioni al giorno”).</p>
 <h4>Le tre zone</h4><p>La laguna è divisa nei tre bacini delle bocche di porto: <b>Nord</b> (Lido), <b>Centro</b> (Malamocco), <b>Sud</b> (Chioggia). Tocca un bacino sulla mappa o un riquadro per aprire la zona.</p>
 <h4>Il semaforo</h4><ul><li><span class="sem" style="background:var(--verde)"></span><b>Verde</b>: vento medio fino a ${k(v)} nodi</li><li><span class="sem" style="background:var(--giallo)"></span><b>Giallo</b>: da ${k1(v)} a ${km(r)} nodi</li><li><span class="sem" style="background:var(--rosso)"></span><b>Rosso</b>: da ${k(r)} nodi in su</li></ul>
 <p>Conta il vento medio, media dei punti della zona, arrotondato al nodo intero: il colore corrisponde sempre al numero che vedi. Le raffiche sono indicate ma non cambiano il colore.</p>
 <p>Ogni ora ha il suo colore (il quadratino con il bordo bianco, in una tonalità più intensa per staccare dal fondo); il colore del giorno è quello più frequente nelle ore della finestra. Per esempio 7 ore verdi e una gialla danno un giorno verde, con l'ora gialla ben visibile.</p>
 <h4>Marea</h4><p>Curva del bollettino del Centro Maree del Comune (linea piena) e marea astronomica (tratteggiata). Se il bollettino ha più di ${k(R.cpsm_ore_max)} ore è indicato come tendenza meno affidabile.</p>
 <h4>Nella pagina della zona</h4><p>Ora per ora (vento, raffiche, direzione, marea, corrente, pioggia), curva di marea, pioggia per modello, onda in mare aperto (fuori dalle bocche, corretta con le misure della Piattaforma CNR), aria, temperatura dell'acqua, cielo, sole e luna. In alto si sceglie il giorno.</p>
 <h4>Previsione e Verifica</h4><p><b>Previsione</b> apre il dettaglio completo; <b>Verifica</b> (a giornata conclusa) confronta la previsione con le misure delle stazioni. In cima alle due pagine trovi “‹ Torna a Forecast Lagoon” e il link <b>PDF ↗</b>, per salvarla o mandarla a qualcuno.</p>
 <h4>Una previsione che impara</h4><p>Ogni giorno l'app confronta la previsione con quello che è stato misurato davvero: vento e raffiche nelle stazioni del Centro Maree, onda in mare aperto alla Piattaforma oceanografica del CNR. Questi confronti si accumulano giorno dopo giorno e servono a correggere le previsioni successive: più passa il tempo, più la previsione si adatta alla laguna.</p>
 <h4>Vento adesso</h4><p>Sotto ogni zona e nella sua pagina c'è il vento <b>misurato adesso</b> dalla stazione del Centro Maree della zona (Laguna Nord alle Saline, Malamocco Porto, Chioggia Porto), con raffica, direzione, ora della misura e andamento delle ultime 3 ore. È una misura, non la previsione; il colore segue la stessa regola del semaforo. Se l'ultima misura ha più di 30 minuti viene indicato.</p>
 ${D.allerta?`<h4>Allerte vento</h4><p>Dalle ${esc(D.allerta.ora_inizio)} alle ${esc(D.allerta.ora_fine)} l'app controlla ogni ${esc(D.allerta.controllo_min)} minuti le stazioni del Centro Maree (Laguna Nord, Diga Lido, Malamocco Porto, Piattaforma CNR, Diga Sud Chioggia, Chioggia Porto). Se in una stazione la raffica arriva ad almeno <b>${esc(D.allerta.raffica_kn)} kn</b> e il vento medio sale di almeno ${esc(D.allerta.salita_kn)} kn in ${esc(D.allerta.finestra_min)} minuti, manda una notifica con stazione, raffica, direzione e ora. Un groppo spesso colpisce prima una parte della laguna e poi le altre: l'avviso può darti da pochi minuti a mezz'ora di anticipo. Se colpisce per prima la tua zona, l'avviso arriva insieme al vento.</p><div class="avvall"><b>Attenzione.</b> Servizio sperimentale e gratuito, basato solo sulle misure, senza alcuna garanzia: l'avviso può arrivare in ritardo o non arrivare (stazione ferma, rete assente, telefono in silenzioso o in Full immersion). Non è un'allerta ufficiale e non sostituisce l'osservazione del cielo, il VHF e i bollettini meteo: la decisione di uscire o di rientrare resta sempre tua.</div><div id="allUI" class="allui"></div>`:''}
 <h4>Temperatura dell'acqua</h4><p>È una <b>misura</b>, non una previsione: l'ultimo valore della stazione del Centro Maree di Punta Salute (Canal Grande), l'unica che oggi la trasmette, in gradi interi. Vale come riferimento per tutta la laguna: sui bassi fondali può essere diversa. Dopo qualche giorno compare anche la tendenza (in aumento, in calo o stabile).</p>
 <h4>Due previsioni al giorno</h4><p>Verso le ${esc(D.ora_mattino||'')} esce la <b>previsione provvisoria</b> per il giorno dopo, utile per organizzare l'uscita con un giorno di anticipo. Verso le ${esc(D.ora_aggiornamento||'')} la sostituisce la <b>previsione definitiva</b>, con il bollettino di marea del Centro Maree delle 13:30 e i modelli meteo più recenti. In cima alla previsione è scritto quale delle due stai guardando e a che ora è stata emessa. Se dopo le ${esc(D.ora_attesa||'')} c'è ancora solo la provvisoria, compare l'avviso “Aggiornamento in ritardo”.</p>
 <h4>Installarla come app</h4><p><b>iPhone</b> (Safari): Condividi → Aggiungi alla schermata Home.<br><b>Android</b> (Chrome): menu ⋮ in alto a destra → “Aggiungi a schermata Home” oppure “Installa app”.<br>Si apre a tutto schermo come un'app. Le previsioni nuove si caricano da sole quando la riapri o ci torni sopra; quando esce una nuova versione dell'app compare in basso la barra “Nuova versione disponibile · <b>Aggiorna</b>”: toccala per caricarla.</p>
 <h4>Avvertenza</h4><p>Previsione indicativa, calcolata da modelli meteo e corretta dove ci sono misure: non sostituisce i bollettini ufficiali. Prima di uscire controlla anche il bollettino <a href="https://www.arpa.veneto.it/dati-ambientali/bollettini/meteo/bollettino-meteo-veneto" target="_blank" rel="noopener">Meteo Veneto di ARPAV</a> (zona "Venezia e laguna") e gli eventuali avvisi meteo.</p></div>`;

// v3.17: allerte vento (Web Push). Chiave e iscrizioni sul Worker; parametri in D.allerta (index.json).
const ALLsw='serviceWorker' in navigator;if(ALLsw)navigator.serviceWorker.register('sw.js').catch(()=>{});
const ALLb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
let ALLkey=null;
async function allPost(p,o){const r=await fetch(D.allerta.url+'/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});return r.json()}
async function allerteUI(msg){
 const u=document.getElementById('allUI');if(!u||!D.allerta)return;
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),app=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 if(!ALLsw||!('PushManager' in window)||!('Notification' in window)){u.innerHTML=`<span class="st">${ios&&!app?'Per ricevere le allerte apri Forecast Lagoon dall\'icona sulla schermata Home (vedi «Installarla come app»).':'Questo browser non riceve notifiche: le allerte non sono disponibili qui.'}</span>`;return}
 if(!ALLkey)fetch(D.allerta.url+'/chiave').then(r=>r.json()).then(j=>{ALLkey=j.chiave||null}).catch(()=>{});
 let sub=null;try{sub=await (await navigator.serviceWorker.ready).pushManager.getSubscription()}catch(e){}
 if(sub){u.innerHTML=`<span class="st">● Allerte vento <b>attive</b> su questo dispositivo.${msg?' '+esc(msg):''}</span><button data-a="prova">Invia una prova</button><button class="sec" data-a="off">Disattiva</button>`}
 else if(Notification.permission==='denied'){u.innerHTML=`<span class="st">Notifiche bloccate per Forecast Lagoon: riattivale in Impostazioni › Notifiche, poi riapri questa pagina.</span>`;return}
 else{u.innerHTML=`<span class="st">${msg?esc(msg):'Allerte vento non attive su questo dispositivo.'}</span><button data-a="on">Attiva allerte vento</button>`}
 u.querySelectorAll('button').forEach(b=>b.onclick=async e=>{e.stopPropagation();const a=b.dataset.a;b.disabled=true;
  try{
   if(a==='on'){const p=await Notification.requestPermission();if(p!=='granted'){allerteUI('Permesso per le notifiche non concesso.');return}
    if(!ALLkey){const j=await (await fetch(D.allerta.url+'/chiave')).json();ALLkey=j.chiave}
    const reg=await navigator.serviceWorker.ready;const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ALLb64(ALLkey)});
    const r=await allPost('iscrivi',s.toJSON());allerteUI(r.ok?'Fatto: riceverai le allerte.':'Iscrizione non riuscita, riprova.')}
   else if(a==='off'){const s=await (await navigator.serviceWorker.ready).pushManager.getSubscription();if(s){await allPost('disiscrivi',s.toJSON()).catch(()=>{});await s.unsubscribe()}allerteUI('Allerte disattivate.')}
   else if(a==='prova'){const s=await (await navigator.serviceWorker.ready).pushManager.getSubscription();const r=await allPost('prova',s.toJSON());allerteUI(r.push_http<300?'Prova inviata: la notifica arriva tra pochi secondi.':'Prova non riuscita ('+(r.push_http||r.error)+').')}
  }catch(err){allerteUI('Errore: '+(err&&err.message||err))}})
}
async function caricaAdesso(){if(!D||!D.adesso_url)return;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
 AD=await (await fetch(D.adesso_url,{cache:'no-store',signal:c.signal})).json();clearTimeout(t)}catch(e){AD=null}riempiAdesso()}
function riempiAdesso(){
 document.querySelectorAll('[data-adh]').forEach(el=>{const a=AD&&AD.zone&&AD.zone[el.dataset.adh];
  el.innerHTML=!a?'':a.disponibile?`<i style="background:${col(a.sem)}"></i>Adesso ${a.kn} kn${a.dir?' '+esc(a.dir):''}${a.raffica_kn!=null?', raffica '+a.raffica_kn:''} <small>· ${esc(a.ora)}</small>`:`<small>Adesso: ${esc(a.motivo||'misura non disponibile')}</small>`});
 document.querySelectorAll('[data-adz]').forEach(el=>{const a=AD&&AD.zone&&AD.zone[el.dataset.adz];if(!a){el.style.display='none';return}el.style.display='';
  if(!a.disponibile){el.innerHTML=`<div class="t"><span>Vento adesso · misurato</span></div><div class="r" style="margin-top:6px">${esc(a.stazione)}: ${esc(a.motivo||'misura non disponibile')}</div>`;return}
  const S=(a.serie||[]),V=S.filter(x=>x!=null),mn=Math.min(...V),mx=Math.max(...V),T=a.trend;
  const pts=S.map((x,i)=>x==null?null:`${(i*300/Math.max(S.length-1,1)).toFixed(1)},${(30-(mx>mn?(x-mn)/(mx-mn):.5)*26).toFixed(1)}`).filter(Boolean).join(' ');
  el.innerHTML=`<div class="t"><span>Vento adesso · misurato</span></div><div class="n"><span style="color:${col(a.sem)}">${a.kn}</span><small>kn</small>${a.dir_g!=null?`<span class="d"><span class="arr" style="display:inline-block;transform:rotate(${a.dir_g+180}deg)">↑</span> ${esc(a.dir)}</span>`:''}</div>
  <div class="r">${a.raffica_kn!=null?'raffica '+a.raffica_kn+' kn · ':''}${esc(a.stazione)}, ${esc(a.ora)}</div>${T?`<div class="r">${esc(T.testo)}</div>`:''}
  ${V.length>1&&T?`<div class="ln"><span>${T.da_kn}</span><svg viewBox="0 0 300 34" preserveAspectRatio="none"><polyline fill="none" stroke="#5fd3c6" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${pts}"/></svg><span>${a.kn} kn</span></div>`:''}`})}
async function controlla(){caricaAdesso();try{
 const V=await (await fetch('versione.json',{cache:'no-store'})).json();
 if(V.codice&&V.codice!==CODICE&&!CODICE.startsWith('__')){barra(V);return}
 if(D&&V.aggiornato_utc&&V.aggiornato_utc!==D.aggiornato_utc){D=await (await fetch('index.json',{cache:'no-store'})).json();vai()}
}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')controlla()});
setInterval(controlla,15*60*1000);
function vai(){if(!D||!G)return;const p=location.hash.replace(/^#/,'').split('/');if(p[0]==='zona')zona(p[1],p[2]);else home();riempiAdesso()}
window.addEventListener('hashchange',vai);
let T0=Date.now();   // v3.9: tocchi su fasce e mappa ignorati per 600 ms dopo il caricamento (tocco "rimbalzato" da Aggiorna)
document.addEventListener('click',e=>{if(Date.now()-T0<600&&e.target.closest&&e.target.closest('.zone,.hero')){e.preventDefault();e.stopPropagation()}},true);
if(/[?&]v=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);   // v3.9: tolto ?v= dall'indirizzo
Promise.all([fetch('index.json',{cache:'no-store'}).then(r=>r.json()),fetch('assets/laguna_bacini.json?v='+CODICE).then(r=>r.json())])
 .then(([d,g])=>{D=d;G=g;T0=Date.now();vai();controlla()}).catch(e=>{app.innerHTML=`<div class="empty">Impossibile leggere i dati: ${esc(e)}</div>`});
</script>
</body>
