 .home .giorno{grid-area:giorno;padding:0 28px 10px}.home .ritardo{grid-area:ritardo}   /* v3.47: titolo del giorno e "Prossimi giorni" anche su schermo largo (prima finivano fuori griglia) */
 .home .hero{grid-area:hero;position:sticky;top:0;height:100vh}

const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

const col=c=>TXT[c]?`var(--${c})`:'var(--nd)', oncol=c=>TXT[c]?`var(--on-${c})`:'var(--on-nd)';
const nf=(x,d=1)=>x==null?'–':Number(x).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const rng=(a,b)=>{const x=nf(a,0),y=nf(b,0);return x===y?x:x+'–'+y};   // v3.54: "8 kn" se min=max, altrimenti "8–10"

function dataDi(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}

// v3.49: tre fasce della giornata. Bottoni sulle prossime fasce (quella in corso + le successive, al massimo 3);

function verNome(a){return 'Verifica'+(a.verifica_fascia?' '+a.verifica_fascia.replace(/:00/g,''):'')}   // v3.75

 if(a.verifica)return '';const N=adessoIT(),g=s=>Date.parse(s+'T00:00:00Z')/60000,passati=g(N.d)+N.m-g(a.data)-finMin(a.finestra)[1];
 if(!(passati>=0))return '';return a.verifica_no||passati>(D.verifica_ore_max||24)*60?'Verifica non disponibile':'Verifica in arrivo'}
function slotTutti(){const M={};(D.zone||[]).forEach(z=>(z.voci||[]).forEach(v=>{const k=v.data+'|'+v.finestra;if(!M[k]){const [a,b]=finMin(v.finestra),d=dataDi(v.data);M[k]={k,data:v.data,fin:v.finestra,ini:new Date(d.getTime()+a*6e4),fine:new Date(d.getTime()+b*6e4)}}}));
 return Object.values(M).sort((x,y)=>x.ini-y.ini)}

function fsel(){const S=slotVisibili();if(!FS||!S.some(s=>s.k===FS))FS=slotDefault();return FS}
function scegliFascia(k){FS=k;home();riempiAdesso()}   // v3.50: rimette il vento misurato sulla cartina (gia' caricato)

 return (r==='Oggi'&&a>=18*60?'Stasera':r||GG[d.getDay()]+' '+d.getDate())+' '+hh(a)+'–'+hh(b)}

function mappa(vb,o){
 let s=`<svg viewBox="${vb}" preserveAspectRatio="${o.meet?'xMidYMid meet':'xMidYMid slice'}" xmlns="http://www.w3.org/2000/svg"><defs>
 <filter id="gl${o.k}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${o.blur||5}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="gr${o.k}"><feColorMatrix type="matrix" values="0.78 0 0 0 0  0 0.86 0 0 0.01  0 0 0.95 0 0.03  0 0 0 1 0"/></filter></defs>
 <image href="assets/laguna_sat.jpg" x="${G.img?G.img.x:0}" y="${G.img?G.img.y:0}" width="${G.img?G.img.w:G.w}" height="${G.img?G.img.h:G.h}" filter="url(#gr${o.k})" opacity=".9"/>`;
 const cAd=z=>{const a=AD&&AD.zone&&AD.zone[z.id];return a&&a.disponibile?a.sem:null};   // v3.44: in prima pagina colori dal vento misurato adesso
 D.zone.forEach(z=>{const v=ultima(z),c=o.adesso?cAd(z):o.colori&&o.colori[z.id]!==undefined?o.colori[z.id]:(v?v.colore:null),on=!o.only||o.only===z.id,hex=getComputedStyle(document.documentElement).getPropertyValue('--'+(TXT[c]?c:'nd')).trim();
  s+=`<path ${o.adesso?`data-azona="${z.id}" `:''}d="${G.bacini[z.id]}" fill="${hex}" fill-opacity="${on?(o.fo||.4):.06}" stroke="${hex}" stroke-opacity="${on?.95:.25}" stroke-width="${o.sw||2}" ${on?`filter="url(#gl${o.k})"`:''} ${o.click?`style="cursor:pointer" onclick="location.hash='zona/${z.id}'"`:''}/>`;});
 if(o.adesso){const pt=d=>{const n=(d||'').match(/-?\d+\.?\d*/g)||[],r=[];for(let i=0;i+1<n.length;i+=2)r.push([+n[i],+n[i+1]]);return r};   // v3.45: linee di separazione tra le zone
  [['nord','centro'],['centro','sud']].forEach(([a,b])=>{const B=pt(G.bacini[b]),S=pt(G.bacini[a]).filter(p=>B.some(q=>Math.abs(p[0]-q[0])<1.5&&Math.abs(p[1]-q[1])<1.5)).sort((p,q)=>p[0]-q[0]);
   if(S.length<2)return;const d='M'+S.map(p=>p.join(',')).join('L');   // confine = vertici in comune tra i due bacini (laguna_bacini.json)
   s+=`<path d="${d}" fill="none" stroke="#06131d" stroke-opacity=".8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"/><path d="${d}" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"/>`})}
 Object.values(G.bocche).forEach(([n,x,y])=>{s+=`<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#5fd4d0" stroke-width="2.5" class="pulse"/><circle cx="${x}" cy="${y}" r="6" fill="#eaf3f7" stroke="#06131d" stroke-width="2"/>
  <text x="${x+14}" y="${y+7}" fill="#fff" font-size="${o.fs||30}" font-weight="700" paint-order="stroke" stroke="#06131d" stroke-width="4" stroke-opacity=".6">${n}</text>`});
 if(o.labels)D.zone.forEach(z=>{const b=G.bbox[z.id],v=ultima(z),c=o.adesso?cAd(z):o.colori&&o.colori[z.id]!==undefined?o.colori[z.id]:(v?v.colore:null),hex=getComputedStyle(document.documentElement).getPropertyValue('--'+(TXT[c]?c:'nd')).trim();
  const t=z.nome.replace('Laguna ',''),w=t.length*28+82,x=z.id==='nord'?b[0]+(b[2]-b[0])*.52:b[0]+(b[2]-b[0])*.18,y=z.id==='nord'?b[1]+(b[3]-b[1])*.55:(b[1]+b[3])/2;
  s+=`<g style="pointer-events:none"><rect x="${x}" y="${y-38}" width="${w}" height="66" rx="33" fill="#06131d" fill-opacity=".85" stroke="#ffffff" stroke-opacity=".22"/>
  <circle ${o.adesso?`data-azona="${z.id}" `:''}cx="${x+34}" cy="${y-5}" r="13" fill="${hex}"/><text x="${x+60}" y="${y+10}" fill="#fff" font-size="43" font-weight="750" letter-spacing="-.5">${t}</text></g>${o.adesso?`<g data-adm="${z.id}" data-x="${x}" data-y="${y-126}" style="pointer-events:none"></g>`:''}`});   // v3.59: targhetta nodi piu' in alto (pillola piu' grande)

function piede(){return `<div class="foot">Previsione indicativa: non sostituisce i bollettini ufficiali. <b>Fonti e licenze</b> → <span class="flink" role="button" onclick="istruzioni()">istruzioni (i)</span><br>Sito v${esc(D.versione_sito)}${D.autore?' · a cura di '+esc(D.autore):''} · aggiornato ${new Date(D.aggiornato_utc).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`}   // v3.57: fonti spostate nelle istruzioni, qui solo il rimando
function finestra(){return null}   // v3.49: tre fasce (v3.64: 05–12, 12–18, 18–24)
function istruzioni(){
 const R=D.regole||{},v=R.verde_fino_a,r=R.rosso_da,k=x=>x==null?'…':nf(x,0),k1=x=>x==null?'…':nf(x+1,0),km=x=>x==null?'…':nf(x-1,0);
 const el=document.createElement('div');el.className='velo';el.onclick=e=>{if(e.target===el)el.remove()};
 el.innerHTML=`<div class="sheet"><h3>Come si legge<span class="x" onclick="this.closest('.velo').remove()">Chiudi</span></h3>
 <h4>Cos'è</h4><p>Previsione di vento e mare per uscire in barca in laguna (Nord, Centro, Sud), in tre fasce della giornata: 05–12, 12–18 e 18–24, da scegliere con i bottoni sotto la cartina. Una previsione che impara: ogni giorno viene confrontata con le misure e corretta di conseguenza.</p>
 <h4>Il semaforo</h4><ul><li><span class="sem" style="background:var(--verde)"></span><b>Verde</b>: vento medio fino a ${k(v)} nodi</li><li><span class="sem" style="background:var(--giallo)"></span><b>Giallo</b>: da ${k1(v)} a ${km(r)} nodi</li><li><span class="sem" style="background:var(--rosso)"></span><b>Rosso</b>: da ${k(r)} nodi in su</li></ul><p>Vento medio dell'ora; le raffiche sono indicate ma non cambiano il colore.</p>
 <h4>Aggiornamenti</h4><p><b>Vento, pioggia e nebbia</b> si aggiornano verso le ${esc((D.ore_giri||[]).join(', '))}: anche la fascia in corso. Verso le ${esc(D.ora_mattino||'')} esce la <b>provvisoria</b> per il giorno dopo, verso le ${esc(D.ora_aggiornamento||'')} la <b>definitiva</b>. La <b>marea</b> si aggiorna a ogni nuovo bollettino del Centro Maree, di norma entro pochi minuti. Sotto le fasce ci sono i due orari separati; con ⚠ in giallo il dato è più vecchio del previsto. La verifica confronta con le misure la previsione fatta prima dell'inizio della fascia.</p><h4>Le fasce</h4><p>I bottoni sotto la cartina mostrano la fascia in corso e le prossime; all'apertura è scelta la fascia in corso, fino alla sua fine; quando non ce n'è una in corso, la prossima. Il vento è corretto con le misure in laguna al mattino e di sera; nel pomeriggio il modello sbaglia poco e non è corretto. Il PDF raccoglie le tre fasce del giorno in una pagina.</p>
 <h4>Pioggia</h4><p>In prima pagina, per ogni zona, la probabilità più alta di pioggia nella fascia: grigia sotto il 20%, azzurra dal 20%, in evidenza dal 50%. Le ore sono nella pagina della zona, ora per ora.</p>
 <h4>Marea</h4><p>In prima pagina, qualunque fascia si scelga, e nella pagina della zona di oggi il grafico copre 24 ore che scorrono con l’orologio: 8 ore già passate e 16 che arrivano; la riga verticale con scritto «domani» (o «oggi», nelle prime ore) segna la mezzanotte. Nella pagina della zona degli altri giorni va dalle 00 alle 24. È riferito alla stazione della zona (Laguna Nord Saline, Malamocco Porto, Chioggia Porto), con ora e centimetri sullo zero di Punta Salute di alte (▲, in bianco) e basse (▼, in verde lime); la barretta turchese sulle ore indica la fascia scelta, la riga gialla tratteggiata è adesso. La curva turchese è la previsione; la linea gialla continua e il puntino giallo sono l'acqua misurata: se sta sotto la curva l'acqua è più bassa del previsto, se sta sopra è più alta. Nella pagina della zona, in alto sulla linea gialla compaiono i centimetri misurati dalla stazione e, sopra il grafico, l'ora della misura; senza una misura degli ultimi 30 minuti il puntino non c'è. Nel tratto già passato la linea grigia è l'ultima previsione e quella gialla l'acqua misurata nelle ultime 8 ore; dove mancano le misure resta solo il grigio. Anche le scritte delle alte e basse già passate sono in grigio. È la previsione del Centro Maree per Punta Salute spostata con i ritardi e le differenze di quota misurati alle stazioni; il passaggio da Punta Salute alle zone non considera il vento. La Laguna Nord (Saline) arriva circa 70–90 minuti dopo Punta Salute, Malamocco e Chioggia quasi non ritardano. Nella pagina della zona si tocca il grafico per leggere ora e livello; la linea tratteggiata è la marea astronomica. Orario indicativo: con maree piccole il colmo è piatto e l'ora è meno precisa.</p>
  <h4>Nebbia</h4><p>Nella pagina della zona, ora per ora: probabile, poco probabile o non probabile. È un'indicazione dai modelli, non ancora verificata con le misure.</p><p>Quando c'è nebbia adesso compare anche la <b>visibilità misurata</b> all'aeroporto di Venezia Tessera, sul bordo nord della laguna (più lontano dalla zona, più è indicativa): nebbia fitta fino a 200 m, nebbia fino a 500 m, nebbia leggera fino a 1000 m; «banchi di nebbia» quando l'aeroporto li segnala anche con visibilità migliore.</p>
 <h4>Previsione incerta ⚠</h4><p>Compare quando i modelli non sono d’accordo: ICON-D2 prevede almeno 3 nodi più di ECMWF (già corretto). In quelle ore per prudenza la stima segue ICON-D2, il più alto dei due, e il vento reale può stare in tutta la forbice. In prima pagina il ⚠ compare accanto al vento solo se la forbice va da un colore del semaforo a un altro; il dettaglio ora per ora è nella pagina della zona. Succede in media circa un giorno su cinque al Centro, meno a Nord e Sud.</p>
 <h4>Vento adesso</h4><p>Nella pagina della zona, sotto la tabella ora per ora, il grafico di oggi unisce il vento <b>misurato</b> dalla stazione del Centro Maree della zona (in bianco, ultime 3 ore, con raffica, direzione, ora e andamento) e la <b>stima</b> delle prossime ore, fino a 8 (in turchese). La linea tratteggiata turchese è la stima sulle ore già passate, per vedere se il vento sta andando come previsto; i puntini sono le raffiche previste, la barretta verticale la forbice dei modelli, le fasce colorate il semaforo. Negli altri giorni il grafico mostra solo la previsione della fascia scelta.</p><p>In prima pagina il vento misurato adesso è scritto sulla cartina, sotto il nome di ogni zona (nodi, direzione con freccia, raffica); le tre fasce sotto il titolo sono solo la previsione.</p>
 ${D.allerta?`<h4>Allerte vento</h4><p>Dalle ${esc(D.allerta.ora_inizio)} alle ${esc(D.allerta.ora_fine)}, ogni ${esc(D.allerta.controllo_min)} minuti, l'app controlla le stazioni del Centro Maree. Se in una stazione la raffica arriva ad almeno <b>${esc(D.allerta.raffica_kn)} kn</b> <b>e</b> il vento medio è salito di almeno ${esc(D.allerta.salita_kn)} kn in ${esc(D.allerta.finestra_min)} minuti, arriva una notifica con stazione, raffica, direzione e ora. Si attiva da qui sotto, aprendo l'app dall'icona sulla schermata Home. In barca servono dati mobili accesi e suoneria attiva.</p><div class="avvall"><b>Attenzione.</b> Servizio sperimentale, senza garanzia: l'avviso può arrivare in ritardo o non arrivare. Non sostituisce cielo, VHF e bollettini meteo: la decisione di uscire o rientrare resta tua.</div><div id="allUI" class="allui"></div>`:''}
 <h4>Installarla come app</h4><p><b>iPhone</b> (Safari): Condividi → Aggiungi alla schermata Home.<br><b>Android</b> (Chrome): menu ⋮ → “Aggiungi a schermata Home”. Previsioni e nuove versioni si caricano da sole.</p>
 <h4>Avvertenza</h4><p>Previsione indicativa: non sostituisce i bollettini ufficiali. Prima di uscire controlla anche il bollettino <a href="https://www.arpa.veneto.it/dati-ambientali/bollettini/meteo/bollettino-meteo-veneto" target="_blank" rel="noopener">Meteo Veneto di ARPAV</a> e gli eventuali avvisi meteo.</p>
 <h4>Fonti e licenze</h4><p>Dati meteo e mare aperto <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0; modelli ICON-D2, ICON-2i, ECMWF; elaborati e corretti con le misure locali). Marea, vento misurato (“Vento adesso” e allerte), temperatura dell'acqua e onda alla Piattaforma CNR: dati CPSM – Centro Previsioni e Segnalazioni Maree, Comune di Venezia (<a href="https://dati.venezia.it/?q=content/cpsm-dati-meteomarini-laguna-e-litorale-veneziano" target="_blank" rel="noopener">dati.venezia.it</a>, CC BY). Visibilità: METAR di Venezia Tessera, <a href="https://aviationweather.gov/" target="_blank" rel="noopener">AviationWeather.gov</a> (NOAA). Correnti: modello Laguna Viva. Immagine satellitare: ${esc(G.fonte_immagine)} · costa ${esc(G.fonte_costa)}; ${esc(G.nota_confini)}.</p></div>`;
 document.body.append(el);allerteUI()}
function ritardo(){
 const ult=slotTutti().map(s=>s.data).sort().pop();   // v3.49: giorno piu' lontano previsto, qualunque sia la fascia scelta
 if(!ult||!D.ora_attesa)return '';const ora=new Date(),oggi=new Date(ora);oggi.setHours(0,0,0,0);
 const [hh,mm]=D.ora_attesa.split(':').map(Number),soglia=new Date(oggi);soglia.setHours(hh,mm,0,0);
 const atteso=new Date(oggi);atteso.setDate(atteso.getDate()+(ora>=soglia?1:0));
 const prov=ora>=soglia&&dataDi(ult)>=atteso&&D.zone.some(z=>(z.voci||[]).some(u=>u.data===ult&&u.provvisoria));   // v3.2
 if(prov)return `<div class="ritardo"><b>Aggiornamento in ritardo.</b> La previsione definitiva non è ancora uscita: qui vedi quella provvisoria del mattino.</div>`;
 if(dataDi(ult)>=atteso)return '';
 const agg=new Date(D.aggiornato_utc).toLocaleString('it-IT',{weekday:'long',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
 const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),giorno=s=>{const d=dataDi(s);return GIORNI[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};
 return `<div class="ritardo"><b>Aggiornamento in ritardo.</b> La previsione di ${esc(giorno(iso(atteso)))} non è ancora uscita: qui vedi quella di ${esc(giorno(ult))}. Ultimo aggiornamento ${esc(agg)}.</div>`}
function oreTxt(a){const r=[];a.forEach(x=>{const n=+x,l=r[r.length-1];if(l&&+l[1]===n-1)l[1]=x;else r.push([x,x])});return r.map(([a,b])=>a===b?a:a+'–'+b).join(', ')}   // v3.48
function incSegno(s){return s&&(s.incerta_colore||[]).length?`<b class="wi" role="img" aria-label="Vento incerto alle ore ${esc(oreTxt(s.incerta_colore))}">⚠\uFE0E</b>`:''}   // v3.65: solo se cambia il colore
