<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forecast Lagoon">
<meta name="theme-color" content="#06131d">
<meta name="versione-sito" content="__VERSIONE_SITO__">
<link rel="apple-touch-icon" href="assets/icona_180.png">
<link rel="manifest" href="manifest.json">
<title>Forecast Lagoon</title>
<style>
:root{--ink:#06131d;--card:#0f2638;--card2:#14314a;--line:#23465f;--txt:#eaf3f7;--mut:#8aa6b6;--soft:#cfe0e8;--teal:#5fd4d0;
--verde:#38c98a;--giallo:#f2b63c;--rosso:#ef5b4c;--nd:#5b7488;--on-verde:#03301d;--on-giallo:#3d2900;--on-rosso:#3d0a05;--on-nd:#e6eef3}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;position:relative}
.testa{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(env(safe-area-inset-top) + 18px) 20px 12px}
.testa h1{font-size:34px;line-height:1.05;margin-top:6px}
.testa .sub{max-width:none;margin-top:6px;font-size:14px}
.hero{position:relative;height:max(260px,calc(100vh - 475px));height:max(260px,calc(100svh - 475px));overflow:hidden;background:#0b1b28}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,22,.9) 0%,rgba(4,14,22,.35) 30%,rgba(4,14,22,0) 52%,rgba(6,19,29,.96) 100%);pointer-events:none}
.top{position:absolute;left:24px;right:24px;top:calc(env(safe-area-inset-top) + 28px)}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--teal);text-transform:uppercase}
h1{font-size:42px;line-height:1;font-weight:750;letter-spacing:-.02em;margin-top:8px}
h1 span{color:var(--teal)}
.sub{color:#b8cdd8;font-size:15px;line-height:1.45;margin-top:10px;max-width:270px}
.oggi{position:absolute;left:24px;bottom:12px;font-size:13.5px;color:var(--soft);display:flex;align-items:center;gap:8px}
.oggi b{font-weight:650}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(95,212,208,.18)}
.credit{position:absolute;right:12px;bottom:8px;font-size:9px;color:rgba(255,255,255,.5)}
.zones{padding:6px 16px 0}
.zone{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:12px 16px 12px 0;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:transform .15s}
.zone:active{transform:scale(.985)}
.zone .bar{align-self:stretch;min-height:52px;border-radius:0 6px 6px 0}
.zname{font-size:20px;font-weight:650;letter-spacing:-.01em}
.zmeta{font-size:12.5px;color:var(--mut);margin-top:3px}
.badge{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.chip{font-size:12px;font-weight:650;padding:5px 11px;border-radius:999px;white-space:nowrap}
.wind{font-size:12px;color:var(--soft)}
.zone.off{opacity:.6;cursor:default}
.foot{padding:14px 24px calc(env(safe-area-inset-bottom) + 30px);color:#6f8a9a;font-size:11px;line-height:1.6}
.foot b{color:#9db5c3;font-weight:600}
.zhero{position:relative;height:300px;overflow:hidden;background:#0b1b28}
.zhero svg{position:absolute;inset:0;width:100%;height:100%}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;font-size:14px;color:var(--soft);background:rgba(6,19,29,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.ztitle{position:absolute;left:22px;bottom:18px}
.ztitle h2{font-size:32px;font-weight:750;letter-spacing:-.02em}
.days{display:flex;gap:8px;padding:16px 16px 4px;overflow-x:auto}
.day{flex:1;min-width:68px;text-align:center;padding:9px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--mut);cursor:pointer;position:relative}
.day b{display:block;font-size:15px;color:var(--txt);margin-top:2px}
.day i{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%}
.day.on{background:var(--txt);color:#33505f;border-color:var(--txt)}.day.on b{color:var(--ink)}
.sec{padding:12px 16px 0}
.verdict{border-radius:24px;padding:18px}
.verdict .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.verdict .v{font-size:30px;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.verdict p{font-size:14px;line-height:1.4;margin-top:4px;opacity:.9}
.hours{display:grid;gap:4px;margin-top:14px}
.hours div{border-radius:8px;text-align:center;padding:5px 0 4px;font-size:10px;font-weight:650;color:rgba(0,0,0,.6)}
.hours div b{display:block;font-size:13px;color:rgba(0,0,0,.8)}
.hours div u{display:block;text-decoration:none;font-size:9px;font-weight:600;color:rgba(0,0,0,.55)}
.tab th u{display:block;text-decoration:none;text-transform:none;letter-spacing:0;font-size:10px;margin-top:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.ch span{text-transform:none;letter-spacing:0;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.big small{font-size:14px;color:var(--mut);font-weight:500;margin-left:4px}
.note{color:var(--mut);font-size:12.5px;margin-top:5px;line-height:1.4}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;padding:14px 16px 0}
.btn{text-align:center;padding:14px 0;border-radius:16px;font-size:14.5px;font-weight:650;background:var(--card2);border:1px solid var(--line)}
.btn.p{background:var(--teal);color:#04282a;border-color:var(--teal)}
.list{padding:18px 16px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .l{display:flex;gap:9px;align-items:center}.row .l i{width:9px;height:9px;border-radius:50%}
.row .r a{color:var(--teal);font-size:13px;margin-left:12px}
.empty{padding:26px 22px;color:var(--soft);line-height:1.5}
.ttl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 2px 6px}
.info{position:relative;flex:none;margin-top:2px;width:38px;height:38px;border-radius:50%;background:rgba(6,19,29,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);color:var(--txt);font:italic 700 19px Georgia,serif;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.velo{position:fixed;inset:0;background:rgba(2,8,12,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0c2131;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);-webkit-overflow-scrolling:touch}
.sheet h3{font-size:22px;font-weight:750;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.sheet h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:18px 0 6px}
.sheet p,.sheet li{font-size:14.5px;line-height:1.5;color:var(--soft)}.sheet ul{padding-left:18px}
.sheet .x{font-size:15px;font-weight:600;color:var(--mut);cursor:pointer;padding:4px 8px}
.sem{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.ver{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:rgba(95,212,208,.16);color:var(--teal);font-size:10.5px;letter-spacing:.06em;vertical-align:1px}
.agg{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:30;max-width:536px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--teal);color:#04282a;border-radius:18px;padding:13px 14px 13px 18px;font-size:14.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.agg b{background:#04282a;color:var(--teal);border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.tab{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.tab th{font-weight:500;color:var(--mut);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:0 0 6px}
.tab td{text-align:center;padding:7px 0;border-top:1px solid rgba(35,70,95,.6);color:var(--soft)}
.tab td:first-child{color:var(--mut);font-weight:600}.tab .kn{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--txt)}
.tab .kn i{width:8px;height:8px;border-radius:50%}
.arr{display:inline-block;font-size:13px;line-height:1}
.mini{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.01em}.mini small{font-size:12.5px;color:var(--mut);font-weight:500;margin-left:3px}
details.card summary{cursor:pointer;list-style:none;font-size:11.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
details.card p{font-size:13.5px;line-height:1.5;color:var(--soft);margin-top:8px}
@media (min-width:900px){
 .wrap{max-width:1400px}
 .home{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);grid-template-areas:"hero testa" "hero zones" "hero foot";grid-template-rows:auto auto 1fr;column-gap:8px}
 .home .hero{grid-area:hero;position:sticky;top:0;height:100vh}
 .home .testa{grid-area:testa;padding:40px 28px 18px}.home .testa h1{font-size:46px}
 .home .zones{grid-area:zones;padding:6px 24px 0}.home .foot{grid-area:foot}
 .zone{padding:18px 18px 18px 0}
 .zhero{height:380px}
 .zhero svg{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%)}
 .corpo{column-count:2;column-gap:4px;padding:0 12px}
 .corpo .sec{break-inside:avoid}
 .corpo .days,.corpo .btns,.corpo .list{column-span:all}
 .zwrap{max-width:1200px;margin:0 auto}
}
.ritardo{margin:0 16px 10px;padding:11px 14px;border-radius:14px;background:rgba(242,182,60,.14);border:1px solid rgba(242,182,60,.45);color:#f6d48a;font-size:13.5px;line-height:1.4}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:18;opacity:0}}
.pulse{animation:pulse 2.4s ease-out infinite}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Caricamento…</div></div>
<script>
const app=document.getElementById('app');
const VERSIONE='__VERSIONE_SITO__',CODICE='__CODICE_SITO__';
const TXT={verde:'Verde',giallo:'Giallo',rosso:'Rosso'};
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
let D=null,G=null;
const col=c=>TXT[c]?`var(--${c})`:'var(--nd)', oncol=c=>TXT[c]?`var(--on-${c})`:'var(--on-nd)';
const nf=(x,d=1)=>x==null?'–':Number(x).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const fresco=u=>u+(u.includes('?')?'&':'?')+'v='+encodeURIComponent((D&&D.aggiornato_utc)||CODICE);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function dataDi(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}
function relativo(iso){const t=new Date();t.setHours(0,0,0,0);const n=Math.round((dataDi(iso)-t)/864e5);return n===0?'Oggi':n===1?'Domani':n===-1?'Ieri':null}
function etichetta(iso){const d=dataDi(iso),r=relativo(iso);return (r?r+' · ':'')+GIORNI[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)}
function ultima(z){return z.voci&&z.voci[0]}
function mappa(vb,o){
 let s=`<svg viewBox="${vb}" preserveAspectRatio="${o.meet?'xMidYMid meet':'xMidYMid slice'}" xmlns="http://www.w3.org/2000/svg"><defs>
 <filter id="gl${o.k}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${o.blur||5}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="gr${o.k}"><feColorMatrix type="matrix" values="0.78 0 0 0 0  0 0.86 0 0 0.01  0 0 0.95 0 0.03  0 0 0 1 0"/></filter></defs>
 <image href="assets/laguna_sat.jpg" x="${G.img?G.img.x:0}" y="${G.img?G.img.y:0}" width="${G.img?G.img.w:G.w}" height="${G.img?G.img.h:G.h}" filter="url(#gr${o.k})" opacity=".9"/>`;
 D.zone.forEach(z=>{const v=ultima(z),c=v?v.colore:null,on=!o.only||o.only===z.id,hex=getComputedStyle(document.documentElement).getPropertyValue('--'+(TXT[c]?c:'nd')).trim();
  s+=`<path d="${G.bacini[z.id]}" fill="${hex}" fill-opacity="${on?(o.fo||.4):.06}" stroke="${hex}" stroke-opacity="${on?.95:.25}" stroke-width="${o.sw||2}" ${on?`filter="url(#gl${o.k})"`:''} ${o.click?`style="cursor:pointer" onclick="location.hash='zona/${z.id}'"`:''}/>`;});
 Object.values(G.bocche).forEach(([n,x,y])=>{s+=`<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#5fd4d0" stroke-width="2.5" class="pulse"/><circle cx="${x}" cy="${y}" r="6" fill="#eaf3f7" stroke="#06131d" stroke-width="2"/>
  <text x="${x+14}" y="${y+7}" fill="#fff" font-size="${o.fs||22}" font-weight="700" paint-order="stroke" stroke="#06131d" stroke-width="4" stroke-opacity=".6">${n}</text>`});
 if(o.labels)D.zone.forEach(z=>{const b=G.bbox[z.id],v=ultima(z),c=v?v.colore:null,hex=getComputedStyle(document.documentElement).getPropertyValue('--'+(TXT[c]?c:'nd')).trim();
  const t=z.nome.replace('Laguna ',''),w=t.length*21+62,x=z.id==='nord'?b[0]+(b[2]-b[0])*.52:b[0]+(b[2]-b[0])*.18,y=z.id==='nord'?b[1]+(b[3]-b[1])*.55:(b[1]+b[3])/2;
  s+=`<g style="pointer-events:none"><rect x="${x}" y="${y-30}" width="${w}" height="52" rx="26" fill="#06131d" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".18"/>
  <circle cx="${x+27}" cy="${y-4}" r="10" fill="${hex}"/><text x="${x+47}" y="${y+8}" fill="#fff" font-size="32" font-weight="750" letter-spacing="-.5">${t}</text></g>`});
 return s+'</svg>'}
function piede(){return `<div class="foot"><b>Fonti</b> · vento Open-Meteo (ICON-D2, ICON-2i, ECMWF) · marea CPSM Comune di Venezia · correnti modello Laguna Viva · immagine: ${esc(G.fonte_immagine)} · costa ${esc(G.fonte_costa)}; ${esc(G.nota_confini)}.<br>Previsione indicativa: non sostituisce i bollettini ufficiali.<br>Sito v${esc(D.versione_sito)} · aggiornato ${new Date(D.aggiornato_utc).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`}
function finestra(){const v=D.zone.map(ultima).filter(Boolean)[0];return v&&v.finestra}
function istruzioni(){
 const R=D.regole||{},v=R.soglia_verde,r=R.soglia_rosso,k=x=>x==null?'…':nf(x,0);
 const el=document.createElement('div');el.className='velo';el.onclick=e=>{if(e.target===el)el.remove()};
 el.innerHTML=`<div class="sheet"><h3>Come si legge<span class="x" onclick="this.closest('.velo').remove()">Chiudi</span></h3>
 <h4>Cos'è</h4><p>Previsione meteo-marina della laguna per uscire in barca: vento, marea, correnti, onda e pioggia, nella finestra ${esc(finestra()||'del mattino')}. Si aggiorna da sola ogni pomeriggio con la previsione del giorno dopo.</p>
 <h4>Le tre zone</h4><p>La laguna è divisa nei tre bacini delle bocche di porto: <b>Nord</b> (Lido), <b>Centro</b> (Malamocco), <b>Sud</b> (Chioggia). Tocca un bacino sulla mappa o un riquadro per aprire la zona.</p>
 <h4>Il semaforo</h4><ul><li><span class="sem" style="background:var(--verde)"></span><b>Verde</b>: vento medio sotto ${k(v)} nodi</li><li><span class="sem" style="background:var(--giallo)"></span><b>Giallo</b>: da ${k(v)} a ${k(r)} nodi</li><li><span class="sem" style="background:var(--rosso)"></span><b>Rosso</b>: da ${k(r)} nodi in su</li></ul>
 <p>Conta il vento medio, media dei punti della zona. Le raffiche sono indicate ma non cambiano il colore. Il colore del giorno è quello più frequente nelle ore della finestra; i quadratini mostrano ora per ora il colore e i nodi.</p>
 <h4>Marea</h4><p>Curva del bollettino del Centro Maree del Comune (linea piena) e marea astronomica (tratteggiata). Se il bollettino ha più di ${k(R.cpsm_ore_max)} ore è indicato come tendenza meno affidabile.</p>
 <h4>Nella pagina della zona</h4><p>Ora per ora (vento, raffiche, direzione, marea, corrente, pioggia), curva di marea, pioggia per modello, onda in laguna e in mare aperto, aria, cielo, sole e luna. In alto si sceglie il giorno.</p>
 <h4>Previsione e Verifica</h4><p><b>Previsione</b> apre il dettaglio completo; <b>Verifica</b> (a giornata conclusa) confronta la previsione con le misure delle stazioni. In cima alle due pagine trovi “‹ Torna a Forecast Lagoon” e il link <b>PDF ↗</b>, per salvarla o mandarla a qualcuno.</p>
 <p>Per ora la verifica e la correzione del vento con le misure ci sono solo per la Laguna Centro; Nord e Sud usano il modello così com'è.</p>
 <h4>Sull'iPhone</h4><p>In Safari: Condividi → Aggiungi alla schermata Home. Si apre come un'app.</p>
 <h4>Avvertenza</h4><p>Previsione indicativa, calcolata da modelli meteo e corretta dove ci sono misure: non sostituisce i bollettini ufficiali. In barca decide chi esce.</p></div>`;
 document.body.append(el)}
function ritardo(ult){
 if(!ult||!D.ora_attesa)return '';const ora=new Date(),oggi=new Date(ora);oggi.setHours(0,0,0,0);
 const [hh,mm]=D.ora_attesa.split(':').map(Number),soglia=new Date(oggi);soglia.setHours(hh,mm,0,0);
 const atteso=new Date(oggi);atteso.setDate(atteso.getDate()+(ora>=soglia?1:0));
 if(dataDi(ult)>=atteso)return '';
 const agg=new Date(D.aggiornato_utc).toLocaleString('it-IT',{weekday:'long',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
 const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),giorno=s=>{const d=dataDi(s);return GIORNI[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};
 return `<div class="ritardo"><b>Aggiornamento in ritardo.</b> La previsione di ${esc(giorno(iso(atteso)))} non è ancora uscita: qui vedi quella di ${esc(giorno(ult))}. Ultimo aggiornamento ${esc(agg)}.</div>`}
function home(){
 const date=D.zone.map(ultima).filter(Boolean).map(v=>v.data).sort();const ult=date[date.length-1];const fin=finestra();
 let h=`<div class="home"><header class="testa"><div><div class="eyebrow">Laguna di Venezia<span class="ver">v${esc(VERSIONE)}</span></div><h1>Forecast <span>Lagoon</span></h1>
 <div class="sub">Previsioni meteo-marine per uscire in barca: vento, marea, correnti, onda e pioggia. Ogni giorno${fin?', '+esc(fin):''}.</div></div><div class="info" role="button" aria-label="Istruzioni" onclick="istruzioni()">i</div></header>
 <div class="hero">${mappa('40 -60 1000 1360',{meet:true,labels:true,click:true,k:'h',fo:.24,sw:2.5})}<div class="shade" style="background:linear-gradient(180deg,rgba(6,19,29,.55) 0%,rgba(6,19,29,0) 18%,rgba(6,19,29,0) 72%,rgba(6,19,29,.95) 100%)"></div>
 ${ult?`<div class="oggi"><span class="dot"></span>${esc(etichetta(ult))}</div>`:''}<div class="credit">© ESA · Copernicus Sentinel-2</div></div>${ritardo(ult)}<div class="zones">`;
 D.zone.forEach(z=>{const v=ultima(z),s=v&&v.sintesi;
  h+=`<div class="zone ${z.attiva?'':'off'}" ${z.attiva?`onclick="location.hash='zona/${z.id}'"`:''}><div class="bar" style="background:${col(v&&v.colore)}"></div>
  <div><div class="zname">${esc(z.nome)}</div><div class="zmeta">Bocca di ${esc(z.bocca)}${z.attiva?(v.data!==ult?' · '+esc(etichetta(v.data)):''):' · in arrivo'}</div></div>
  <div class="badge">${v?`<span class="chip" style="background:${col(v.colore)};color:${oncol(v.colore)}">${TXT[v.colore]||'n.d.'}</span><span class="wind">${nf(s.vento_min,0)}–${nf(s.vento_max,0)} kn${s.direzione?' · '+esc(s.direzione):''}</span>`:`<span class="chip" style="background:#22394B;color:var(--mut)">In arrivo</span>`}</div></div>`});
 app.innerHTML=h+'</div>'+piede()+'</div>';window.scrollTo(0,0)}
function curva(s){
 const C=s.marea_curva||[],A=s.marea_astro||[];if(C.length<2)return '';
 const all=C.concat(A).map(p=>p[1]),mn=Math.min(...all)-5,mx=Math.max(...all)+5,x0=C[0][0],x1=C[C.length-1][0],W=330,H=110;
 const X=t=>(t-x0)/(x1-x0)*W,Y=v=>H-(v-mn)/(mx-mn)*H,pt=a=>a.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
 const f=s.marea_fascia||[x0,x1],tick=[];for(let t=Math.ceil(x0/120)*120;t<=x1;t+=120)tick.push(t);
 return `<svg viewBox="0 0 ${W} ${H+18}" width="100%"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd4d0" stop-opacity=".42"/><stop offset="1" stop-color="#5fd4d0" stop-opacity="0"/></linearGradient></defs>
 <rect x="${X(f[0])}" y="0" width="${X(f[1])-X(f[0])}" height="${H}" fill="#ffffff" fill-opacity=".04"/>
 <polygon points="0,${H} ${pt(C)} ${W},${H}" fill="url(#tg)"/>${A.length?`<polyline points="${pt(A)}" fill="none" stroke="#8aa6b6" stroke-width="1.2" stroke-dasharray="4 4"/>`:''}
 <polyline points="${pt(C)}" fill="none" stroke="#5fd4d0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
 ${tick.map(t=>`<text x="${Math.min(W-14,Math.max(0,X(t)-6))}" y="${H+15}" fill="#6f8a9a" font-size="10">${String(t/60).padStart(2,'0')}</text>`).join('')}</svg>`}
function oraPerOra(s){const O=s.ore_dettaglio||[];if(!O.length)return '';
 const fr=g=>g==null?'':`<span class="arr" style="transform:rotate(${g+180}deg)">↑</span>`;
 return `<div class="sec"><div class="card"><div class="ch">Ora per ora <span>vento medio della zona</span></div><table class="tab"><tr><th>Ora</th><th>Vento<u>kn</u></th><th>Raff.<u>kn</u></th><th>Da</th><th>Marea</th><th>Corrente</th><th>Pioggia</th></tr>
 ${O.map(o=>`<tr><td>${esc(o.ora)}</td><td><span class="kn"><i style="background:${col(o.sem)}"></i>${nf(o.stima,0)}</span></td><td>${nf(o.raff,0)}</td><td>${fr(o.dir_g)} ${esc(o.dir||'')}</td>
 <td>${esc(o.marea||'')}</td><td>${o.corr==null?'–':(o.verso==='entra'?'▲ ':'▼ ')+nf(o.corr,1)}</td><td>${o.pioggia_prob==null?'–':o.pioggia_prob+'%'}</td></tr>`).join('')}</table>
 <div class="note">vento e raffiche in nodi (kn) · corrente in m/s alla bocca, ▲ entra ▼ esce · pioggia = probabilità</div></div></div>`}
function meteoOnda(s){const M=s.meteo||{},P=M.pressione,L=M.luna;let h='<div class="sec grid2">';
 if(s.onda_laguna_max!=null)h+=`<div class="card"><div class="ch">Onda in laguna</div><div class="mini">fino a ${nf(s.onda_laguna_max,2)}<small>m</small></div><div class="note">stima, onda significativa</div></div>`;
 if(s.onda_mare_max!=null)h+=`<div class="card"><div class="ch">Mare aperto</div><div class="mini">${nf(s.onda_mare_min,1)}–${nf(s.onda_mare_max,1)}<small>m</small></div><div class="note">onda fuori dalla bocca</div></div>`;
 if(M.aria)h+=`<div class="card"><div class="ch">Aria</div><div class="mini">${esc(M.aria[0])}–${esc(M.aria[1])}<small>°C</small></div><div class="note">${M.aria_acqua?'sull’acqua '+esc(M.aria_acqua[0])+'–'+esc(M.aria_acqua[1])+' °C':''}</div></div>`;
 if(P||M.nuvolosita!=null)h+=`<div class="card"><div class="ch">Cielo</div><div class="mini">${M.nuvolosita==null?'–':M.nuvolosita}<small>% nuvole</small></div><div class="note">${P?'pressione '+esc(P[0])+' → '+esc(P[1])+' hPa, '+esc(P[2]):''}</div></div>`;
 if(s.alba)h+=`<div class="card"><div class="ch">Sole</div><div class="mini">${esc(s.alba)}<small>alba</small></div><div class="note">tramonto ${esc(s.tramonto||'')}</div></div>`;
 if(L)h+=`<div class="card"><div class="ch">Luna</div><div class="mini">${L[0]}<small>%</small></div><div class="note">${esc(L[1]||'')}</div></div>`;
 return h+'</div>'}
function dettagli(s){let h='';if(s.verdetto_testo)h+=`<div class="sec"><details class="card"><summary>Il verdetto per esteso ▾</summary><p>${esc(s.verdetto_testo)}</p>${(s.note||[]).map(n=>`<p>${esc(n)}</p>`).join('')}</details></div>`;return h}
function pioggia(s){
 const P=s.pioggia_ore||[];if(!P.length)return '';
 const T0=s.pioggia_tot||{},secco=Object.values(T0).every(v=>!v)&&!s.pioggia_prob_max;
 if(secco)return `<div class="sec"><div class="card"><div class="ch">Pioggia <span>ICON-D2 · ICON-2i · ECMWF</span></div><div class="mini">Nessuna pioggia prevista</div><div class="note">0 mm e probabilità 0% in tutte le ore della finestra</div></div></div>`;
 const mm=P.flatMap(r=>[r.mm_D2,r.mm_2i,r.mm_EC]).filter(x=>x!=null),mx=Math.max(1,...mm),W=330,H=90,n=P.length,bw=W/n;
 const M=[['mm_D2','#5fd4d0'],['mm_2i','#7fa8ff'],['mm_EC','#c9a7ff']];
 let g='';P.forEach((r,i)=>{M.forEach(([k,c],j)=>{const v=r[k];if(v==null)return;const hh=v/mx*H;g+=`<rect x="${(i*bw+bw*.14+j*bw*.24).toFixed(1)}" y="${(H-hh).toFixed(1)}" width="${(bw*.22).toFixed(1)}" height="${Math.max(hh,v>0?1.5:0).toFixed(1)}" rx="2" fill="${c}"/>`});
  const p=r.prob_D2!=null?r.prob_D2:r.prob_EC;g+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H+14}" text-anchor="middle" fill="#6f8a9a" font-size="10">${esc((r.ora||'').slice(0,2))}</text>`+(p!=null?`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H+27}" text-anchor="middle" fill="${p>=50?'#cfe0e8':'#6f8a9a'}" font-size="10" font-weight="${p>=50?700:400}">${p}%</text>`:'')});
 const T=s.pioggia_tot||{},leg=M.map(([k,c])=>{const m=k.slice(3);return T[m]==null?'':`<span style="white-space:nowrap"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:5px"></i>${m==='D2'?'ICON-D2':m==='2i'?'ICON-2i':'ECMWF'} ${nf(T[m],1)} mm</span>`}).join(' · ');
 return `<div class="sec"><div class="card"><div class="ch">Pioggia <span>${s.pioggia_prob_max!=null?'probabilità max '+s.pioggia_prob_max+'%':''}</span></div>
 <svg viewBox="0 -4 ${W} ${H+34}" width="100%" style="margin-top:8px">${g}</svg><div class="note">mm nell'ora per modello · % = probabilità (ICON-D2, se manca ECMWF)<br>Totale finestra: ${leg}</div></div></div>`}
function zona(id,dsel){
 const z=D.zone.find(a=>a.id===id);if(!z){location.hash='';return}
 const b=G.bbox[id],p=20,larga=window.innerWidth>=900;let vb=`${b[0]-p} ${b[1]-p} ${b[2]-b[0]+2*p+120} ${b[3]-b[1]+2*p}`;
 if(larga){const hh=b[3]-b[1]+2*p,ww=hh*Math.min(1200,window.innerWidth)/380,cx=(b[0]+b[2])/2+60;vb=`${cx-ww/2} ${b[1]-p} ${ww} ${hh}`}
 let h=`<div class="zwrap"><div class="zhero">${mappa(vb,{only:id,fs:larga?16:24,fo:.28,sw:larga?2:3,k:'z'})}<div class="shade"></div><div class="back" onclick="location.hash=''">‹ Tutte le zone</div>
 <div class="ztitle"><div class="eyebrow">Bocca di ${esc(z.bocca)}<span class="ver">v${esc(VERSIONE)}</span></div><h2>${esc(z.nome)}</h2></div><div class="credit">© ESA · Copernicus Sentinel-2</div></div><div class="corpo">`;
 if(!z.attiva){app.innerHTML=h+`<div class="empty">La previsione per la ${esc(z.nome)} è in preparazione.</div></div>`+piede()+'</div>';window.scrollTo(0,0);return}
 const vv=z.voci.slice(0,4).slice().reverse(),v=z.voci.find(a=>a.data===dsel)||z.voci[0],s=v.sintesi||{},c=v.colore;
 h+=`<div class="days">${vv.map(a=>{const d=dataDi(a.data);return `<div class="day ${a===v?'on':''}" onclick="location.hash='zona/${id}/${a.data}'"><i style="background:${col(a.colore)}"></i>${GG[d.getDay()]}<b>${d.getDate()}/${d.getMonth()+1}</b></div>`}).join('')}</div>`;
 const ore=s.ore||[];
 h+=`<div class="sec"><div class="verdict" style="background:${col(c)};color:${oncol(c)}"><div class="k">${esc(etichetta(v.data))} · ${esc(v.finestra||'')}</div>
 <div class="v">${TXT[c]||'n.d.'}</div><p>${esc(s.andamento||'')}</p>
 <div class="hours" style="grid-template-columns:repeat(${Math.max(ore.length,1)},1fr)">${ore.map(o=>`<div style="background:${o.sem===c?'rgba(0,0,0,.14)':col(o.sem)}">${esc(o.ora)}<b>${nf(o.stima,0)}</b><u>kn</u></div>`).join('')}</div></div></div>`;
 h+=oraPerOra(s);
 h+=`<div class="sec grid2"><div class="card"><div class="ch">Vento medio</div><div class="big">${nf(s.vento_min,0)}–${nf(s.vento_max,0)}<small>kn</small></div><div class="note">${s.direzione?'da '+esc(s.direzione)+(s.direzione_nome?' · '+esc(s.direzione_nome):''):''}</div></div>
 <div class="card"><div class="ch">Raffiche</div><div class="big">${nf(s.raff_max,0)}<small>kn</small></div><div class="note">massimo nella finestra; non cambiano il colore</div></div></div>`;
 if((s.marea_curva||[]).length>1)h+=`<div class="sec"><div class="card"><div class="ch">Marea <span>${esc(s.marea_fonte||'')}${s.marea_eta_h!=null?' · emesso '+s.marea_eta_h+' h prima':''}${s.marea_vecchia?' · tendenza meno affidabile':''}</span></div>${curva(s)}
 <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft)">${(s.marea_estremali||[]).map(e=>`<span>${e.tipo==='max'?'▲':'▼'} ${e.cm>0?'+':''}${e.cm} cm · ${esc(e.ora)}</span>`).join('')}</div></div></div>`;
 h+=pioggia(s);h+=meteoOnda(s);
 if((s.corrente||[]).length)h+=`<div class="sec"><div class="card"><div class="ch">Corrente <span>${esc(s.canale||'')}</span></div><div style="margin-top:6px;font-size:14.5px;line-height:1.5">${s.corrente.map(t=>`${t.verso==='entra'?'Entrante':'Uscente'} ${t.da===t.a?'alle '+esc(t.da):'dalle '+esc(t.da)+' alle '+esc(t.a)}`).join(' · ')}</div></div></div>`;
 h+=dettagli(s);
 h+=`<div class="btns">${v.previsione?`<a class="btn p" href="${esc(fresco(v.previsione))}">Previsione</a>`:''}${v.verifica?`<a class="btn" href="${esc(fresco(v.verifica))}">Verifica${v.verifica_provvisoria?' *':''}</a>`:''}</div>`;
 if(z.voci.length>1)h+=`<div class="list"><div class="ttl">Archivio</div>${z.voci.map(a=>`<div class="row"><span class="l"><i style="background:${col(a.colore)}"></i>${esc(a.titolo||a.data)}</span><span class="r">${a.previsione?`<a href="${esc(fresco(a.previsione))}">previsione</a>`:''}${a.verifica?`<a href="${esc(fresco(a.verifica))}">verifica</a>`:''}</span></div>`).join('')}</div>`;
 app.innerHTML=h+'</div>'+piede()+'</div>';window.scrollTo(0,0)}
function barra(V){if(document.querySelector('.agg'))return;const b=document.createElement('div');b.className='agg';
 b.innerHTML=`<span>Nuova versione disponibile${V.versione_sito?' · v'+esc(V.versione_sito):''}</span><b>Aggiorna</b>`;
 b.querySelector('b').onclick=()=>location.replace(location.pathname+'?v='+encodeURIComponent(V.codice)+location.hash);document.body.append(b)}
async function controlla(){try{
 const V=await (await fetch('versione.json',{cache:'no-store'})).json();
 if(V.codice&&V.codice!==CODICE&&!CODICE.startsWith('__')){barra(V);return}
 if(D&&V.aggiornato_utc&&V.aggiornato_utc!==D.aggiornato_utc){D=await (await fetch('index.json',{cache:'no-store'})).json();vai()}
}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')controlla()});
setInterval(controlla,15*60*1000);
function vai(){if(!D||!G)return;const p=location.hash.replace(/^#/,'').split('/');if(p[0]==='zona')zona(p[1],p[2]);else home()}
window.addEventListener('hashchange',vai);
Promise.all([fetch('index.json',{cache:'no-store'}).then(r=>r.json()),fetch('assets/laguna_bacini.json?v='+CODICE).then(r=>r.json())])
 .then(([d,g])=>{D=d;G=g;vai();controlla()}).catch(e=>{app.innerHTML=`<div class="empty">Impossibile leggere i dati: ${esc(e)}</div>`});
</script>
